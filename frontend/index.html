<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt classifier</title><link rel="stylesheet" href="/style.css"><script defer src="/forms.js"></script></head>
<body><main>
<h1>Prompt classifier</h1><form id="classifier">
<label for="prompt">Prompt or document</label><textarea id="prompt" rows="7" maxlength="16384" required placeholder="Paste up to 16,384 characters"></textarea>
<button>Scan document</button></form>
<output id="result" aria-live="polite" hidden></output>
<section id="evidence" aria-labelledby="evidence-title" hidden>
<h2 id="evidence-title">Highest-scoring passage</h2>
<p id="location"></p><blockquote id="excerpt"></blockquote></section>
</main></body></html>
